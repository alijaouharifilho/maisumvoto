# Mais um voto: nginx para o site 100% estático (dist/ do Vite + dados em /dados).
# Instalação, certificados e validação: deploy/README.md. Validar local: deploy/validar-nginx.sh.
#
# Vai em /etc/nginx/conf.d/maisumvoto.conf e é incluído DENTRO do http{} do nginx.conf
# principal; por isso começa com diretivas de nível http (log_format, limit_req_zone, map).
#
# Valores fixos a conferir na instalação:
#   domínio       maisumvoto.com.br  (= site.dominio de config/candidatura.json; o teste
#                 deploy/testes/nginx-conf.test.mjs falha se divergir)
#   raiz          /srv/maisumvoto/current  (= $DEPLOY_DIR/current do deploy/publicar.sh)
#   certificados  /etc/letsencrypt/live/maisumvoto.com.br/  (certbot, um certificado com
#                 apex + www)
#   ACME          /var/www/certbot  (webroot do certbot)
#
# Domínio canônico: o apex, sem www. O link compartilhado no WhatsApp fica mais curto e,
# numa VPS sem CDN, não existe a limitação de CNAME no apex. www redireciona com 301.
#
# Requer nginx >= 1.25.1 por causa de "http2 on;". No nginx 1.24 (Ubuntu 24.04), apague as
# linhas "http2 on;" e troque "listen 443 ssl;" por "listen 443 ssl http2;".

# ---------------------------------------------------------------- nível http

# Log de acesso SEM IP (LGPD; plano: nenhum IP em claro em log). $uri não leva a query
# (?v=versão). Sem Referer e sem User-Agent: só o mínimo para medir carga e erro.
log_format muv_sem_ip '$time_iso8601 $request_method "$uri" $status $body_bytes_sent '
                      '$request_time $sent_http_content_encoding';

# Anti-abuso em /dados/. A zona vive em memória compartilhada; nada vai para o disco.
# Taxa folgada de propósito: no 4G brasileiro muita gente sai pelo mesmo IP (CGNAT), e
# abrir o mapa pede dezenas de arquivos de uma vez.
limit_req_zone $binary_remote_addr zone=muv_dados:10m rate=40r/s;

# .mjs não está no mime.types de toda versão do nginx; servido como octet-stream, o
# navegador recusa o worker por causa do nosniff. Blocos types do mesmo nível se somam.
types {
    text/javascript mjs;
}

# Cache-Control por status e caminho, aplicado por um único add_header no server.
# A primeira regex que casa vence, então a ordem importa (índice antes do resto de /dados/).
# Só 200/206/304 recebem cache longo; 404 e demais erros ficam no-store, para um arquivo
# que ainda não existe não ficar "inexistente" em cache por 1 ano.
# /mapa/maplibre-<versão>/ é imutável: a versão está no caminho (src/mapa/biblioteca.ts) e
# atualizar o MapLibre muda a pasta. /mapa/estilo.json não tem versão e fica nos 5 min.
map "$status:$uri" $muv_cache {
    default                                   "no-store";
    "~^(200|304):/(index\.html)?$"            "no-cache";
    "~^(200|206|304):/assets/"                "public, max-age=31536000, immutable";
    "~^(200|206|304):/mapa/maplibre-[0-9][^/]*/" "public, max-age=31536000, immutable";
    "~^(200|304):/dados/indice\.json$"        "public, max-age=60";
    "~^(200|206|304):/dados/"                 "public, max-age=31536000, immutable";
    "~^(200|206|304):/"                       "public, max-age=300";
}

# ---------------------------------------------------------------- servidores

# Host desconhecido na porta 80 (varredura por IP): fecha a conexão sem responder.
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;
    access_log off;
    return 444;
}

# HTTPS com SNI desconhecido: recusa o handshake sem expor o certificado do site.
server {
    listen 443 ssl default_server;
    listen [::]:443 ssl default_server;
    server_name _;
    access_log off;
    ssl_reject_handshake on;
}

# HTTP do site: só o desafio do certbot; o resto vai para HTTPS no domínio canônico.
server {
    listen 80;
    listen [::]:80;
    server_name maisumvoto.com.br www.maisumvoto.com.br;
    server_tokens off;
    access_log off;

    # Site estático: só GET e HEAD, e sem corpo. A recusa sai aqui (fase server-rewrite), antes da checagem
    # de tamanho do corpo, que gravaria no log de erro "client intended to send too large body ... client: <IP>".
    # Ainda pode cair IP no log de erro (corpo chunked inválido, falha de TLS em nível crit); a privacidade diz isso.
    if ($request_method !~ ^(GET|HEAD)$) {
        return 405;
    }
    if ($http_content_length ~ "^[1-9]") {
        return 400;
    }
    if ($http_transfer_encoding) {
        return 400;
    }

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
        try_files $uri =404;
    }

    location / {
        return 301 https://maisumvoto.com.br$request_uri;
    }
}

# HTTPS www: redireciona para o apex.
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name www.maisumvoto.com.br;
    server_tokens off;
    access_log off;

    # Os parâmetros TLS ficam no server (e não no nível http) porque o nginx.conf do
    # Ubuntu já define ssl_protocols no http{}; repetir lá daria "directive is duplicate".
    ssl_certificate     /etc/letsencrypt/live/maisumvoto.com.br/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/maisumvoto.com.br/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:muv_tls:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    return 301 https://maisumvoto.com.br$request_uri;
}

# HTTPS do site.
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name maisumvoto.com.br;
    server_tokens off;

    ssl_certificate     /etc/letsencrypt/live/maisumvoto.com.br/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/maisumvoto.com.br/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:muv_tls:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;
    # Sem OCSP stapling: o Let's Encrypt encerrou o OCSP em 2025.

    # Symlink trocado a cada deploy (releases/<versão>). Sem open_file_cache de propósito:
    # o cache de descritores manteria a release antiga servindo por até 60 s.
    root /srv/maisumvoto/current;
    charset utf-8;
    charset_types text/css text/plain text/javascript application/javascript application/json image/svg+xml;

    access_log /var/log/nginx/maisumvoto.acesso.log muv_sem_ip buffer=64k flush=5s;
    # Nível warn: as mensagens "info" (como a do limit_req abaixo) trazem o IP do cliente.
    error_log /var/log/nginx/maisumvoto.erro.log warn;
    log_not_found off;

    # .br/.gz gerados por ferramentas/precomprimir.mjs; nada é comprimido por requisição.
    gzip_static on;
    gzip_vary on;
    # brotli_static exige o módulo ngx_brotli. O include com curinga não falha se o arquivo
    # não existir: sem o módulo, copie só este nginx.conf e o site fica com gzip_static.
    include /etc/nginx/snippets/maisumvoto-brotli*.conf;

    # Herança de add_header: um add_header dentro de uma location ANULA todos os do server.
    # Por isso todos ficam aqui e nenhuma location tem add_header (deploy/testes confere).
    # Os valores abaixo são os de deploy/cabecalhos-seguranca.json (o teste exige igualdade).
    # style-src sem 'unsafe-inline': o MapLibre só mexe em estilo via CSSOM (permitido) e a
    # doc dele pede apenas worker-src 'self' e img-src data: blob:. blob: no worker-src
    # cobre o caso de o worker vir de outra origem (o MapLibre embrulha em blob:).
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data: blob: https://tiles.openfreemap.org; font-src 'self'; connect-src 'self' https://tiles.openfreemap.org; worker-src 'self' blob:; child-src 'self' blob:; manifest-src 'self'; object-src 'none'; frame-ancestors 'none'; base-uri 'none'; form-action 'self'" always;
    add_header Permissions-Policy "geolocation=(self), clipboard-write=(self), fullscreen=(self), accelerometer=(), autoplay=(), browsing-topics=(), camera=(), clipboard-read=(), display-capture=(), encrypted-media=(), gyroscope=(), magnetometer=(), microphone=(), midi=(), payment=(), picture-in-picture=(), publickey-credentials-get=(), screen-wake-lock=(), sync-xhr=(), usb=(), xr-spatial-tracking=()" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Cross-Origin-Opener-Policy "same-origin" always;
    add_header Cache-Control $muv_cache always;

    limit_req_status 429;
    limit_req_log_level info;

    # Site estático: só GET e HEAD, e sem corpo. A recusa sai aqui (fase server-rewrite), antes da checagem
    # de tamanho do corpo, que gravaria no log de erro "client intended to send too large body ... client: <IP>".
    # Ainda pode cair IP no log de erro (corpo chunked inválido, falha de TLS em nível crit); a privacidade diz isso.
    if ($request_method !~ ^(GET|HEAD)$) {
        return 405;
    }
    if ($http_content_length ~ "^[1-9]") {
        return 400;
    }
    if ($http_transfer_encoding) {
        return 400;
    }

    # Roteamento por hash (#/mapa/@lat,lon): não há fallback de SPA; o que não existe é 404.
    location = / {
        try_files /index.html =404;
    }

    location / {
        try_files $uri =404;
    }

    location /assets/ {
        access_log off;
        try_files $uri =404;
    }

    location /dados/ {
        limit_req zone=muv_dados burst=200 nodelay;
        try_files $uri =404;
    }

    # Arquivos ocultos nunca saem (o conferir-dist já barra; esta é a segunda camada).
    location ~ /\. {
        return 404;
    }
}
